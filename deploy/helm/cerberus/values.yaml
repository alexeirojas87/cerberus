# Default values for cerberus.
# This is a YAML-formatted file. Declare variables to be passed into your templates.

# -- Number of daemon replicas.
replicaCount: 1

image:
  # -- Daemon image (Mode A). Published by the CI release; replace with your
  # own registry if you do a full self-host.
  repository: ghcr.io/alexeirojas87/cerberus
  # -- Image tag; a digest or a fixed release tag is recommended.
  tag: "0.1.0"
  # -- Pull policy.
  pullPolicy: IfNotPresent

# -- Secrets for image pull (private registries).
imagePullSecrets: []

# -- Name overrides for the deployment and associated objects.
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount for the pod.
  create: true
  # -- ServiceAccount name (auto-generated if empty).
  name: ""

# -- POD-level securityContext. The daemon writes to `~/.cerberus`; the
# volumes (emptyDir) are mounted at `/root/.cerberus`, so the container
# runs as root inside the pod (same as the official image). For non-root,
# reconfigure `securityContext.runAsUser` and the config mount points.
podSecurityContext: {}

# -- CONTAINER-level securityContext. `readOnlyRootFilesystem: true`
# protects the image layer; writes go to the emptyDir at `/root/.cerberus`.
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

service:
  # -- Service type. The proxy is exposed to the fleet of agents/data.
  type: ClusterIP
  # -- Canonical Cerberus port facing outward (same as in Dockerfile/compose).
  port: 8787
  # -- Actual process port inside the pod (`start --port 8080`).
  targetPort: 8080

# -- Container resources. `{}` as defaults; real values in values-prod.yaml.
resources: {}

config:
  # -- Proxy operating mode: `enforce` (block/redact) or `shadow`.
  mode: enforce
  # -- fail_policy when the engine cannot scan: `closed` (reject) or `open`.
  failPolicy: closed
  # -- Audit retention days.
  retentionDays: 90
  admin:
    # -- Require an admin token? The daemon REFUSES to start on a non-loopback
    # interface (0.0.0.0, the K8s case) without a strong token (>= 24 bytes).
    # That's why the default is `true` and the chart fails (required) if missing.
    enabled: true
    # -- Admin token (>= 24 chars). Usually comes from
    # `${CERBERUS_ADMIN_TOKEN}` in CI: `--set config.admin.token=$CERBERUS_ADMIN_TOKEN`.
    # If `config.admin.enabled=true` and this field is empty, `helm install` FAILS.
    token: ""
  # -- LLM upstreams (same format as `config.yaml` from `cerberus init`).
  #   Each entry: `name -> {url, path_prefix, auth_header}`.
  upstreams:
    openai:
      url: https://api.openai.com
      path_prefix: /openai/
      auth_header: authorization
    anthropic:
      url: https://api.anthropic.com
      path_prefix: /anthropic/
      auth_header: authorization
    gemini:
      url: https://generativelanguage.googleapis.com
      path_prefix: /gemini/
      auth_header: authorization
    default:
      url: https://api.openai.com
      path_prefix: null
      auth_header: authorization
  # -- Opt-in telemetry: OFF by default. The daemon sends nothing unless
  # `telemetry.enabled: true` AND a reachable endpoint.
  telemetry:
    enabled: false
    endpoint: https://telemetry.cerberus.dev/v1/ping
    intervalSecs: 86400

ingress:
  # -- Create an Ingress to expose the proxy outside the fleet?
  enabled: false
  # -- Ingress ClassName (e.g. `nginx`, `traefik`).
  className: ""
  # -- Ingress annotations.
  annotations: {}
  hosts:
    - host: cerberus.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: cerberus-tls
  #    hosts:
  #      - cerberus.example.com

# -- Extra environment variables for the pod:
#   a key->value map turned into env vars via `toYaml ... | nindent 8`.
#   Example:
#   environment:
#     RUST_LOG: info
#   NOTE: env vars reserved by the chart (CERBERUS_LISTEN_HOST,
#   CERBERUS_ADMIN_TOKEN, CERBERUS_TELEMETRY_ENDPOINT) are configured in a
#   fixed/derived way and must not be repeated here.
environment: {}

# -- Liveness/readiness probe config.
probes:
  # -- Daemon healthcheck path.
  path: /health
  # -- Healthcheck port (name).
  port: http