{{- if .Values.config.admin.enabled }}
{{- $adminToken := required "config.admin.token is REQUIRED when config.admin.enabled=true (helm install --set config dot admin dot token equals la env CERBERUS_ADMIN_TOKEN; minimo 24 chars)" .Values.config.admin.token -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cerberus.fullname" . }}-admin
  labels:
    {{- include "cerberus.labels" . | nindent 4 }}
type: Opaque
data:
  admin-token: {{ $adminToken | b64enc | quote }}
{{- end }}