apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cerberus.fullname" . }}
  labels:
    {{- include "cerberus.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cerberus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cerberus.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cerberus.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "cerberus.fullname" . }}-config
        - name: data
          emptyDir: {}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The binary listens on 8080 inside the pod (canonical port for the
          # chart); the Service exposes 8787 to the fleet.
          args:
            - start
            - --port
            - {{ .Values.service.targetPort | quote }}
          env:
            # Force binding to all interfaces (required in K8s); the non-loopback
            # listener requires a strong admin token (guaranteed by the chart).
            - name: CERBERUS_LISTEN_HOST
              value: "0.0.0.0"
            {{- if .Values.config.admin.token }}
            - name: CERBERUS_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cerberus.fullname" . }}-admin
                  key: admin-token
            {{- end }}
            - name: CERBERUS_TELEMETRY_ENDPOINT
              value: {{ .Values.config.telemetry.endpoint | quote }}
            {{- range $key, $value := .Values.environment }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.probes.port }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.probes.port }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /root/.cerberus/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: data
              mountPath: /root/.cerberus