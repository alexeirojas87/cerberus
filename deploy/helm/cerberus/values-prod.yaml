# Production profile for the Cerberus chart.
# Usage:
#   helm upgrade cerberus deploy/helm/cerberus --values deploy/helm/cerberus/values-prod.yaml \
#     --set config.admin.token="$CERBERUS_ADMIN_TOKEN"
#   helm test cerberus
#
# Adjust the image to your published registry before going to production.

replicaCount: 2

image:
  repository: ghcr.io/alexeirojas87/cerberus
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8787
  targetPort: 8080

# Hard resource limits; scale with an HPA if the agent traffic flow
# demands it (recommended: 0.5-1 vCPU per rule core).
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

config:
  mode: enforce
  failPolicy: closed
  retentionDays: 90
  admin:
    # Required token: supplied via --set (CI env) or a pre-existing secret.
    enabled: true
    token: ""
  upstreams:
    openai:
      url: https://api.openai.com
      path_prefix: /openai/
      auth_header: authorization
    anthropic:
      url: https://api.anthropic.com
      path_prefix: /anthropic/
      auth_header: authorization
    gemini:
      url: https://generativelanguage.googleapis.com
      path_prefix: /gemini/
      auth_header: authorization
    default:
      url: https://api.openai.com
      path_prefix: null
      auth_header: authorization
  telemetry:
    # Telemetry OFF in production by default (privacy-by-default).
    # Enable it only after reviewing the policy (telemetry.rs privacy_policy)
    # and deciding on your internal collection endpoint.
    enabled: false
    endpoint: https://telemetry.cerberus.dev/v1/ping
    intervalSecs: 86400

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
  hosts:
    - host: cerberus.my-corp.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: cerberus-tls
      hosts:
        - cerberus.my-corp.example.com

serviceAccount:
  create: true
  name: ""

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

environment:
  RUST_LOG: info