[package]
name = "cerberus-engine"
version = "0.1.0"
edition = "2021"
description = "Cerberus F1 core: pure rule-loader + hybrid AC/regex detection engine (texto -> findings)"

license = "MIT OR Apache-2.0"
repository = "https://github.com/alexeirojas87/cerberus"
readme = "README.md"
keywords = ["secret", "pii", "detection", "engine", "rules"]
categories = ["security", "text-processing"]

[lints]
workspace = true

[dependencies]
aho-corasick = "1"
regex = "1"
# Same tables the compiled regexes use; keeps the fold-to-ASCII presence
# bucket exactly aligned with the keyword regex matching semantics.
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
# R9-8 (F2.2): real zeroization of secret material held by the reversible
# vault. `zeroize` overwrites owned buffers on Drop / explicit wipe.
zeroize = "1"
# R9-8 (F2.2/F2.3): CSPRNG for non-guessable vault token ids and one-shot
# break-glass nonces (no predictable `v1` counters).
getrandom = "0.2"
