[package]
name = "cerberus-packs"
version = "0.1.0"
edition = "2021"
description = "F7: Cerberus rule packs — versioned, signed, auto-updatable"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alexeirojas87/cerberus"
keywords = ["security", "rules", "packs", "signed", "dlp"]
categories = ["security"]
readme = "README.md"

[lints]
workspace = true

[dependencies]
cerberus-engine = { path = "../cerberus-engine" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ed25519-dalek = { version = "2", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tokio = { version = "1", features = ["sync", "macros", "rt"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "default-tls"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"