[package]
name = "spike-scan"
version = "0.1.0"
edition = "2021"
description = "F0 spike: benchmark regex vs vectorscan for secret detection throughput"
license = "MIT"
repository = "https://github.com/cerberus/cerberus"
readme = "README.md"
keywords = ["security", "secret-detection", "benchmark", "regex", "spike"]
categories = ["security", "development-tools::testing"]

[features]
vectorscan = ["dep:vectorscan"]

[dependencies]
aho-corasick = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
benchkit = { path = "../benchkit" }
vectorscan = { version = "0.1", optional = true }

[lints]
workspace = true