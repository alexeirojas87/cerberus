name: notify-tap

# When a new Cerberus release is published, dispatch an event to the
# homebrew-cerberus tap so it updates the formula automatically.

on:
  release:
    types: [published]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to homebrew-cerberus
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ github.event.release.name }}
        run: |
          # Extract version from tag (v0.1.2 → 0.1.2)
          VER="${TAG#v}"
          echo "Dispatching release $VER (tag $TAG) to homebrew-cerberus"
          gh api \
            repos/alexeirojas87/homebrew-cerberus/dispatches \
            -X POST \
            -f event_type=new-release \
            -f "client_payload[version]=$VER" \
            -f "client_payload[tag]=$TAG"
