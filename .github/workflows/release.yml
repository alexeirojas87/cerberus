name: release

# Release pipeline — F8 (cross-platform installers).
#
# Every push to main:
#   1. Bumps the patch version in Cargo.toml (0.1.0 → 0.1.1 → 0.1.2 → ...)
#   2. Commits the bump back to main
#   3. Builds 4 targets (linux x86_64, linux aarch64, macOS aarch64, Windows x86_64)
#   4. Creates a GitHub release (NOT a prerelease) with tag v<version>
#
# Manual workflow_dispatch: same flow, can be used to force a release.
#
#   build (matrix 4 targets): compiles cerberus --release and prepares artifacts
#                             with the SAME naming scheme used by install.sh,
#                             the Homebrew formula and the winget manifest:
#                               cerberus-<version>-<os>-<arch>.tar.gz|.zip
#                             + SHA256SUMS. The real signature is injected in
#                             the same job when credentials are present:
#                             - macOS : codesign + notarytool + stapler
#                                       (secrets APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
#                                        APPLE_TEAM_ID / APPLE_IDENTITY)
#                             - Windows: signtool Authenticode
#                                       (secrets WINDOWS_SIGN_CERT = pfx in base64 /
#                                        WINDOWS_SIGN_PASSWORD)
#                             Without credentials these steps are skipped and the
#                             binaries are published unsigned (documented).
#   release        : aggregates everything and creates the GitHub Release + global SHA256SUMS.
#
# Helm and pack signing are covered by another agent — ONLY vending here.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  bump:
    name: bump version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        id: bump
        run: |
          # Read current version from Cargo.toml
          OLD_VER="$(sed -nE 's/^version = "([^"]+)"/\1/p' crates/cerberus/Cargo.toml | head -1)"
          # Bump patch (0.1.0 → 0.1.1, 1.2.3 → 1.2.4)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD_VER"
          NEW_PATCH=$((PATCH + 1))
          NEW_VER="${MAJOR}.${MINOR}.${NEW_PATCH}"
          # Update Cargo.toml
          sed -i -E "s/^version = \"[^\"]+\"/version = \"${NEW_VER}\"/" crates/cerberus/Cargo.toml
          # Update Cargo.lock
          cargo update -p cerberus --precise "${NEW_VER}" 2>/dev/null || true
          echo "version=${NEW_VER}" >> "$GITHUB_OUTPUT"
          echo "Bumped $OLD_VER → $NEW_VER"

      - name: Commit and push bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/cerberus/Cargo.toml Cargo.lock
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push

  build:
    name: build (${{ matrix.os_name }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: [bump]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: x86_64
            ext: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os_name: linux
            arch: aarch64
            ext: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            os_name: macos
            arch: aarch64
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch: x86_64
            ext: zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-
            ${{ runner.os }}-

      - name: Build release binary + artifact
        id: build
        env:
          CERBERUS_OS: ${{ matrix.os_name }}
          CERBERUS_ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          CERBERUS_STRIP: "1"
        run: |
          ./tools/release/build_release.sh
          art=$(basename "$(echo dist/cerberus-*.${{ matrix.ext }})")
          echo "$art"
          echo "artifact=$art" >> "$GITHUB_OUTPUT"

      # ── macOS signing (only if the CI has Apple credentials) ────────────
      - name: codesign + notarize (macOS)
        if: ${{ runner.os == 'macOS' && env.HAS_APPLE_CREDS == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          HAS_APPLE_CREDS: ${{ (secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '') && 'true' || 'false' }}
        run: |
          ARF="dist/${{ steps.build.outputs.artifact }}"
          echo "signing $ARF"
          bash -x tools/release/macos-notarize.sh "$ARF"

      # ── Windows Authenticode signing (only with credentials) ─────────────────
      - name: signtool Authenticode
        if: ${{ matrix.os == 'windows-latest' && env.HAS_WIN_CREDS == 'true' }}
        shell: bash
        env:
          WINDOWS_SIGN_CERT: ${{ secrets.WINDOWS_SIGN_CERT }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
          HAS_WIN_CREDS: ${{ (secrets.WINDOWS_SIGN_CERT != '' && secrets.WINDOWS_SIGN_PASSWORD != '') && 'true' || 'false' }}
        run: |
          # 1) extract cerberus.exe from the .zip
          python - <<'PY'
          import glob, zipfile
          zips = glob.glob('dist/*.zip')
          assert zips, 'no zip in dist/'
          zipfile.ZipFile(zips[0]).extractall('dist/exe')
          PY
          # 2) locate signtool from the Windows SDK on the runner
          signtool_path="$(ls /c/Program\ Files*/Windows\ Kits/10/bin/*/x64/signtool.exe 2>/dev/null | head -1)"
          [ -n "$signtool_path" ] || { echo "signtool not found; install Windows SDK (choco install windows-sdk)"; exit 1; }
          export PATH="$PATH:$(dirname "$signtool_path")"
          # 3) PFX certificate (in base64) and signing
          echo "$WINDOWS_SIGN_CERT" | base64 --decode > /tmp/cerberus-cert.pfx
          export WINDOWS_SIGN_CERT=/tmp/cerberus-cert.pfx
          bash tools/release/windows-sign.sh dist/exe/cerberus.exe
          # 4) re-pack the zip with the SIGNED exe, same name + checksums
          python - <<'PY'
          import glob, os, zipfile
          zips = [f for f in glob.glob('dist/*.zip')]
          assert zips
          z = zips[0]
          with zipfile.ZipFile(z, 'w', zipfile.ZIP_DEFLATED) as zo:
              zo.write('dist/exe/cerberus.exe', 'cerberus.exe')
          print('re-packaged', z)
          PY
          (cd dist && sha256sum *.zip > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Sanity check
        run: |
          ls -lh dist/
          cat dist/SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cerberus-${{ matrix.os_name }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  # ── GitHub Release publishing ─────────────────────────────────────────
  release:
    name: release
    needs: [bump, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Read version
        id: ver
        run: |
          VER="$(sed -nE 's/^version = "([^"]+)"/\1/p' crates/cerberus/Cargo.toml | head -1)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"

      - name: Collect all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Global SHA256SUMS
        run: |
          cd artifacts
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.msi' \) -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          artefacts=()
          for f in artifacts/*.tar.gz artifacts/*.zip artifacts/*.msi; do
            [ -e "$f" ] && artefacts+=("$f")
          done
          gh release create "${{ steps.ver.outputs.tag }}" \
            "${artefacts[@]}" \
            artifacts/SHA256SUMS \
            --title "Cerberus ${{ steps.ver.outputs.version }}" \
            --notes "## Cerberus ${{ steps.ver.outputs.version }}

          ### Artifacts

          | Platform | File |
          |----------|------|
          | Linux x86_64 | \`cerberus-${{ steps.ver.outputs.version }}-linux-x86_64.tar.gz\` |
          | Linux aarch64 | \`cerberus-${{ steps.ver.outputs.version }}-linux-aarch64.tar.gz\` |
          | macOS aarch64 | \`cerberus-${{ steps.ver.outputs.version }}-macos-aarch64.tar.gz\` |
          | Windows x86_64 | \`cerberus-${{ steps.ver.outputs.version }}-windows-x86_64.zip\` |

          SHA256SUMS attached for download integrity verification.

          ### Install

          \`\`\`bash
          # macOS / Linux
          curl -fsSL https://raw.githubusercontent.com/alexeirojas87/cerberus/main/install.sh | sh

          # Or download the artifact for your platform and extract cerberus
          \`\`\`

          Without signing credentials in CI, binaries are published unsigned."